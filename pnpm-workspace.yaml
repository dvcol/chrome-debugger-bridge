catalogMode: strict
cleanupUnusedCatalogs: true
confirmModulesPurge: false
disallowWorkspaceCycles: true
autoInstallPeers: false
engineStrict: true
saveWorkspaceProtocol: true
shellEmulator: true
strictPeerDependencies: true
trustPolicy: no-downgrade

packages:
  - packages/*
  - examples/*
  - tests/fixtures/*
overrides:
  '@vitejs/devtools-kit>@devframes/hub': 0.9.10
  '@vitejs/devtools-kit>@devframes/json-render': 0.9.10
catalog:
  '@modelcontextprotocol/client': 2.0.0
  '@modelcontextprotocol/node': 2.0.0
  '@modelcontextprotocol/server': 2.0.0
  birpc: ^4.0.0
  hono: 4.11.4
catalogs:
  automation:
    playwright-core: 1.62.1
  build:
    '@dvcol/eslint-config': 1.8.6
    '@prettier/plugin-xml': 3.4.2
    eslint: 10.8.0
    eslint-plugin-format: 2.0.1
    jiti: 2.7.0
    knip: 6.34.0
    prettier: 3.9.6
    publint: 0.3.22
    tsdown: 0.22.14
    turbo: 2.10.8
  devtools:
    '@devframes/hub': 0.9.10
    '@devframes/json-render': 0.9.10
    '@devframes/json-render-ui': 0.9.10
    '@vitejs/devtools-kit': 0.6.1
    devframe: 0.9.10
    vite: 8.1.5
  protocol:
    '@standard-schema/spec': 1.1.0
    devtools-protocol: 0.0.1672245
    zod: 4.4.3
  release:
    bumpp: 12.3.0
    changelogithub: 15.0.5
  testing:
    '@vitest/browser-playwright': 4.1.10
    '@vitest/coverage-v8': 4.1.10
    ajv: 8.20.0
    ajv-formats: 3.0.1
    jsdom: 30.0.1
    playwright: 1.62.1
    vitest: 4.1.10
  transport:
    ws: 8.21.1
  types:
    '@types/chrome': 0.2.9
    '@types/node': 26.1.2
    '@types/ws': 8.18.1
    typescript: 5.9.3
onlyBuiltDependencies:
  - esbuild
peerDependencyRules:
  ignoreMissing:
    - '@vue/compiler-sfc'
