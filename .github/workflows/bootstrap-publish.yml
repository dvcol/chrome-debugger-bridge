name: Bootstrap npm packages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "publish @dvcol/cdb 0.0.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: bootstrap-publish
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Publish initial package names
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - name: Require main and explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "publish @dvcol/cdb 0.0.0"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ~/.cache/ms-playwright

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify bootstrap state
        run: |
          pnpm run verify:release -- --phase current --version 0.0.0
          pnpm verify
          git diff --exit-code

      - name: Publish bootstrap versions
        run: pnpm publish --recursive --access public --tag bootstrap --provenance --no-git-checks --report-summary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
