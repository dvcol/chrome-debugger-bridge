name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # Keep the toolchain and browser setup identical across CI and release workflows.
      - name: 🧰 Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          install-chromium: 'true'

      - name: ✅ Verify workspace
        run: pnpm verify

      - name: 🧹 Verify generated files are committed
        run: git diff --exit-code

      - name: 📎 Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: cdb-verification-${{ github.run_id }}
          path: |
            __traces__/
            coverage/
            playwright-report/
            test-results/
          retention-days: 7
