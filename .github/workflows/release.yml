name: Release
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version, without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create release commit and tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github
    permissions:
      contents: read
    outputs:
      commit-hash: ${{ steps.release-state.outputs.commit-hash }}
      tag-name: ${{ steps.release-state.outputs.tag-name }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.CI_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ~/.cache/ms-playwright

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate release request
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          pnpm run verify:release -- --phase before --version "$RELEASE_VERSION"
          test -z "$(git tag --list "v$RELEASE_VERSION")"

      - name: Configure release identity
        run: |
          git config user.name "GitHub Release Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and verify release
        run: |
          pnpm run release -- --release "$RELEASE_VERSION"
          pnpm run verify:release -- --phase after --version "$RELEASE_VERSION"

      - name: Push release commit and tag
        run: git push origin HEAD:main --follow-tags

      - name: Record release state
        id: release-state
        run: |
          echo "commit-hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag-name=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish packages
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    env:
      PUBLISH_COMMIT: ${{ needs.release.outputs.commit-hash }}
      PUBLISH_TAG: ${{ needs.release.outputs.tag-name }}
    steps:
      - name: Dispatch immutable publication
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REQUEST_ID="release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          PUBLISH_RUN_TITLE="Publish $PUBLISH_TAG ($REQUEST_ID)"
          gh workflow run publish.yml \
            --ref main \
            --field commit-hash="$PUBLISH_COMMIT" \
            --field tag-name="$PUBLISH_TAG" \
            --field request-id="$REQUEST_ID"

          PUBLISH_RUN_ID=""
          for _ in {1..30}; do
            PUBLISH_RUN_ID="$(
              gh run list \
                --workflow publish.yml \
                --event workflow_dispatch \
                --branch main \
                --limit 20 \
                --json databaseId,displayTitle \
              | jq --arg title "$PUBLISH_RUN_TITLE" -r \
                '.[] | select(.displayTitle == $title) | .databaseId' \
              | head -n 1
            )"
            if test -n "$PUBLISH_RUN_ID"; then
              break
            fi
            sleep 2
          done
          test -n "$PUBLISH_RUN_ID"
          echo "publish-run-id=$PUBLISH_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for npm publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RUN_ID: ${{ steps.dispatch.outputs.publish-run-id }}
        run: gh run watch "$PUBLISH_RUN_ID" --exit-status

  github-release:
    name: Create GitHub release
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github
    permissions:
      contents: write
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.commit-hash }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release notes
        run: pnpm exec changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
